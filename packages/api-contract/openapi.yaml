openapi: 3.1.0
info:
  title: SF Gyms API
  version: 0.1.0
  description: Versioned, app-ready API for gym discovery and comparison.
servers:
  - url: https://api.example.com
paths:
  /healthz:
    get:
      operationId: healthz
      responses:
        '200':
          description: Service health
  /api/v1/gyms:
    get:
      operationId: listGyms
      parameters:
        - name: query
          in: query
          schema: { type: string, maxLength: 100 }
        - name: max_monthly
          in: query
          schema: { type: number, minimum: 0 }
        - name: venue_type
          in: query
          description: Repeat this parameter to include multiple venue categories.
          schema:
            type: array
            items: { $ref: '#/components/schemas/VenueType' }
          style: form
          explode: true
      responses:
        '200':
          description: A page of published gym locations
  /api/v1/gyms/{gym_id}:
    get:
      operationId: getGym
      parameters:
        - name: gym_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Gym details }
        '404': { description: Gym not found }
  /api/v1/me:
    get:
      operationId: getCurrentUser
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Current application user }
        '401': { description: Authentication required }
  /api/v1/leads:
    post:
      operationId: createLead
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202': { description: Accepted for idempotent processing }
        '409': { description: Conflicting command }
  /api/v1/reports:
    post:
      operationId: createReport
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202': { description: Accepted for moderation processing }
components:
  schemas:
    VenueType:
      type: string
      enum:
        - traditional_gym
        - boutique_fitness
        - yoga_studio
        - pilates_barre
        - martial_arts_boxing
        - climbing_gym
        - gymnastics
        - personal_training
        - recreation_sports
        - outdoor_fitness
        - dance_movement
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
