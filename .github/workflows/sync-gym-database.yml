name: Sync reviewed gym directory to database

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-gym-directory-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production-data
    env:
      DATABASE_URL: ${{ secrets.SF_GYMS_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install database client
        run: python -m pip install "asyncpg>=0.30,<1"
      - name: Validate committed fixture
        run: python data/imports/sync_directory_database.py verify
      - name: Apply migration and round-trip reviewed fixture
        run: python data/imports/sync_directory_database.py roundtrip --apply-migration
      - name: Verify database export is byte-identical
        run: git diff --exit-code -- data/imports/sf-gyms-osm.json apps/web/lib/sf-gyms-osm.json
