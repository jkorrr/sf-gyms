name: Refresh gym cost coverage

on:
  schedule:
    - cron: "17 1,7,13,19 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Crawl mode
        required: true
        default: deals
        type: choice
        options:
          - deals
          - weekly
          - full
          - mailbox

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: gym-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Choose mailbox, daily-deals, weekly, or monthly-full mode
        id: mode
        shell: bash
        run: |
          echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
          requested="${{ inputs.mode }}"
          if [ -n "$requested" ]; then
            echo "value=$requested" >> "$GITHUB_OUTPUT"
          elif [ "$(date -u +%H)" != "13" ]; then
            echo "value=mailbox" >> "$GITHUB_OUTPUT"
          elif [ "$(date -u +%u)" -eq 1 ] && [ "$(date -u +%d)" -le 7 ]; then
            echo "value=full" >> "$GITHUB_OUTPUT"
          elif [ "$(date -u +%u)" -eq 1 ]; then
            echo "value=weekly" >> "$GITHUB_OUTPUT"
          else
            echo "value=deals" >> "$GITHUB_OUTPUT"
          fi
      - name: Install rendered-crawl runtime
        if: steps.mode.outputs.value != 'mailbox'
        run: |
          python -m pip install "playwright>=1.55,<2"
          python -m playwright install --with-deps chromium
      - name: Verify immutable raw input
        run: python data/imports/materialize_raw_osm.py
      - name: Rebuild canonical fixture from immutable reviewed inputs
        run: python data/imports/merge_web_research.py --date "${{ steps.mode.outputs.date }}"
      - name: Apply reviewed decisions before discovery
        run: python data/imports/cost_coverage.py --date "${{ steps.mode.outputs.date }}"
      - name: Send approved email inquiries and poll tagged replies
        env:
          GYM_RESEARCH_GMAIL_CLIENT_ID: ${{ secrets.GYM_RESEARCH_GMAIL_CLIENT_ID }}
          GYM_RESEARCH_GMAIL_CLIENT_SECRET: ${{ secrets.GYM_RESEARCH_GMAIL_CLIENT_SECRET }}
          GYM_RESEARCH_GMAIL_REFRESH_TOKEN: ${{ secrets.GYM_RESEARCH_GMAIL_REFRESH_TOKEN }}
          GYM_RESEARCH_EMAIL_APPROVALS_B64: ${{ secrets.GYM_RESEARCH_EMAIL_APPROVALS_B64 }}
        run: |
          python data/imports/gmail_research.py send-approved --date "${{ steps.mode.outputs.date }}"
          python data/imports/gmail_research.py poll --date "${{ steps.mode.outputs.date }}"
      - name: Check free public business records
        if: steps.mode.outputs.value != 'deals' && steps.mode.outputs.value != 'mailbox'
        run: python data/imports/discover_public_sources.py
      - name: Discover operator sitemap documents
        if: steps.mode.outputs.value == 'full'
        run: python data/imports/discover_operator_documents.py --date "${{ steps.mode.outputs.date }}"
      - name: Collect historical domain-status signals
        if: steps.mode.outputs.value == 'full'
        run: python data/imports/discover_archive_signals.py --date "${{ steps.mode.outputs.date }}"
      - name: Crawl official public sources
        if: steps.mode.outputs.value != 'mailbox'
        run: python data/imports/crawl_official_sources.py --mode "${{ steps.mode.outputs.value }}"
      - name: Render JavaScript pricing fallbacks
        if: steps.mode.outputs.value != 'mailbox'
        run: python data/imports/render_official_sources.py --mode "${{ steps.mode.outputs.value }}" --timeout-ms 15000
      - name: Build fail-closed catalog review proposals
        if: steps.mode.outputs.value != 'mailbox'
        run: python data/imports/build_catalog_review.py --date "${{ steps.mode.outputs.date }}"
      - name: Build fail-closed location review proposals
        if: steps.mode.outputs.value != 'deals' && steps.mode.outputs.value != 'mailbox'
        run: python data/imports/build_location_review.py
      - name: Recheck reported-price evidence
        if: steps.mode.outputs.value != 'deals' && steps.mode.outputs.value != 'mailbox'
        run: python data/imports/audit_reported_evidence.py
      - name: Generate classified cost coverage
        run: python data/imports/cost_coverage.py --date "${{ steps.mode.outputs.date }}"
      - name: Test import pipeline
        run: python -m unittest discover -s data/imports -p "test_*.py"
      - name: Build static site
        if: steps.mode.outputs.value != 'mailbox'
        working-directory: apps/web
        run: |
          npm ci
          npm run typecheck
          npm run build
      - name: Open or update review PR
        env:
          GH_TOKEN: ${{ github.token }}
          REFRESH_MODE: ${{ steps.mode.outputs.value }}
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No data changes to review."
            exit 0
          fi
          branch="automation/gym-data-refresh"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add \
            data/imports/cost-coverage-report.json \
            data/imports/cost-coverage-review.json \
            data/imports/deal-observations.json \
            data/imports/deal-report.json \
            data/imports/identity-review.json \
            data/imports/manual-source-search.json \
            data/imports/official-crawl-attempts.json \
            data/imports/official-crawl-cache.json \
            data/imports/official-location-observations.json \
            data/imports/official-location-review.json \
            data/imports/official-comparable-prices.json \
            data/imports/official-catalog-review.json \
            data/imports/operator-confirmed-observations.json \
            data/imports/contact-submission-attempts.json \
            data/imports/operator-document-candidates.json \
            data/imports/archive-status-signals.json \
            data/imports/official-crawl-observations.json \
            data/imports/rendered-crawl-attempts.json \
            data/imports/rendered-crawl-observations.json \
            data/imports/public-source-discovery-cache.json \
            data/imports/public-source-discovery-observations.json \
            data/imports/reported-evidence-audit.json \
            data/imports/reported-evidence-cache.json \
            data/imports/sf-gyms-osm.json \
            apps/web/lib/sf-gyms-osm.json
          git commit -m "data: refresh SF gym cost coverage"
          git push --force-with-lease origin "$branch"
          existing="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [ -z "$existing" ]; then
            gh pr create \
              --base main \
              --head "$branch" \
              --title "data: review SF gym cost coverage refresh" \
              --body "Automated $REFRESH_MODE public-source crawl. Review candidate observations, price changes, source failures, and coverage metrics before merging. No candidate price is auto-published as verified."
          else
            gh pr comment "$existing" --body "Updated with the latest $REFRESH_MODE crawl and regenerated coverage report."
          fi
