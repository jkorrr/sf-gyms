services:
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    environment:
      APP_ENV: development
      DEMO_MODE: "false"
      DATABASE_URL: postgresql://sfgyms:sfgyms@db:5432/sfgyms
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: sfgyms
      POSTGRES_PASSWORD: sfgyms
      POSTGRES_DB: sfgyms
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sfgyms -d sfgyms"]
      interval: 5s
      timeout: 5s
      retries: 10
